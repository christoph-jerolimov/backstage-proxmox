apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: proxmox-update-vm-config
  title: Proxmox — Update VM Configuration
  description: |
    Changes the configuration of an existing Proxmox VM. Only the fields you
    fill in are applied. Invokes the `proxmox:update-vm-config` action.
  tags:
    - proxmox
spec:
  owner: user:guest
  type: proxmox-action

  parameters:
    - title: Virtual machine
      required:
        - node
        - vmid
      properties:
        connection:
          title: Connection
          type: string
          description: Title or host of the Proxmox connection. Leave empty when only one is configured.
        node:
          title: Node
          type: string
          default: pve
        vmid:
          title: VMID
          type: number
          default: 101
    - title: Changes
      description: Fill in at least one field.
      properties:
        name:
          title: Name
          type: string
        cores:
          title: Cores
          type: number
        sockets:
          title: Sockets
          type: number
        memory:
          title: Memory (MiB)
          type: number
        tags:
          title: Tags
          type: string
          description: Semicolon separated, for example web;dev
        description:
          title: Description
          type: string
        pool:
          title: Resource pool
          type: string

  steps:
    - id: action
      name: Update VM
      action: proxmox:update-vm-config
      input:
        connection: ${{ parameters.connection }}
        node: ${{ parameters.node }}
        vmid: ${{ parameters.vmid }}
        name: ${{ parameters.name }}
        cores: ${{ parameters.cores }}
        sockets: ${{ parameters.sockets }}
        memory: ${{ parameters.memory }}
        tags: ${{ parameters.tags }}
        description: ${{ parameters.description }}
        pool: ${{ parameters.pool }}

  output:
    text:
      - title: Proxmox instance
        content: ${{ steps['action'].output.connectionTitle }}
      - title: Updated VM
        content: "VMID ${{ steps['action'].output.vmid }} on node ${{ steps['action'].output.node }}"
      - title: Configuration
        content: |
          ${{ steps['action'].output.config | dump }}
