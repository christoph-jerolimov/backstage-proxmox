apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: proxmox-set-container-power-state
  title: Proxmox — Set Container Power State
  description: |
    Starts, stops, shuts down or reboots a Proxmox LXC container.
    Proxmox does not support suspending or resuming containers.
    Invokes the `proxmox:set-container-power-state` action.
  tags:
    - proxmox
spec:
  owner: user:guest
  type: proxmox-action

  parameters:
    - title: Container
      required:
        - node
        - vmid
        - state
      properties:
        connection:
          title: Connection
          type: string
          description: Title or host of the Proxmox connection. Leave empty when only one is configured.
        node:
          title: Node
          type: string
          default: pve
        vmid:
          title: VMID
          type: number
          default: 201
        state:
          title: Power state
          type: string
          enum:
            - start
            - stop
            - shutdown
            - reboot
          default: start

  steps:
    - id: action
      name: Set power state
      action: proxmox:set-container-power-state
      input:
        connection: ${{ parameters.connection }}
        node: ${{ parameters.node }}
        vmid: ${{ parameters.vmid }}
        state: ${{ parameters.state }}

  output:
    text:
      - title: Proxmox instance
        content: ${{ steps['action'].output.connectionTitle }}
      - title: Container status
        content: "VMID ${{ steps['action'].output.vmid }} is ${{ steps['action'].output.status }} (changed: ${{ steps['action'].output.changed }})"
      - title: Proxmox task
        content: ${{ steps['action'].output.taskId }}
