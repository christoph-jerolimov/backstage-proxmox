apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: proxmox-delete-pool
  title: Proxmox — Delete Resource Pool
  description: |
    Removes a Proxmox resource pool. The member VMs, containers and storages
    themselves are never deleted. Invokes the `proxmox:delete-pool` action.
  tags:
    - proxmox
spec:
  owner: user:guest
  type: proxmox-action

  parameters:
    - title: Resource pool
      required:
        - poolid
      properties:
        connection:
          title: Connection
          type: string
          description: Title or host of the Proxmox connection. Leave empty when only one is configured.
        poolid:
          title: Pool id
          type: string
          description: For example pool-staging
        removeMembers:
          title: Detach the pool members first instead of failing
          type: boolean
          description: The VMs, containers and storages themselves are not deleted.
          default: false

  steps:
    - id: action
      name: Delete pool
      action: proxmox:delete-pool
      input:
        connection: ${{ parameters.connection }}
        poolid: ${{ parameters.poolid }}
        removeMembers: ${{ parameters.removeMembers }}

  output:
    text:
      - title: Proxmox instance
        content: ${{ steps['action'].output.connectionTitle }}
      - title: Deleted pool
        content: ${{ steps['action'].output.poolid }}
      - title: Detached members
        content: |
          ${{ steps['action'].output.removedMembers | dump }}
