apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: proxmox-create-vm
  title: Proxmox — Create VM
  description: |
    Creates a QEMU virtual machine on a Proxmox node.
    Invokes the `proxmox:create-vm` action.
  tags:
    - proxmox
spec:
  owner: user:guest
  type: proxmox-action

  parameters:
    - title: Virtual machine
      required:
        - node
        - name
      properties:
        connection:
          title: Connection
          type: string
          description: Title or host of the Proxmox connection. Leave empty when only one is configured.
        node:
          title: Node
          type: string
          description: Name of the Proxmox node
          default: pve
        name:
          title: Name
          type: string
          description: Name of the new VM
        vmid:
          title: VMID
          type: number
          description: Leave empty to allocate the next free VMID
    - title: Resources
      properties:
        cores:
          title: Cores
          type: number
          description: CPU cores per socket
        sockets:
          title: Sockets
          type: number
        memory:
          title: Memory (MiB)
          type: number
        ostype:
          title: OS type
          type: string
          description: Proxmox OS type, for example l26 for modern Linux
        net0:
          title: Network device
          type: string
          description: For example virtio,bridge=vmbr0
        disk:
          title: Disk
          type: string
          description: First SCSI disk, for example local:8 for an 8 GiB volume
    - title: Placement
      properties:
        tags:
          title: Tags
          type: string
          description: Semicolon separated, for example web;dev
        pool:
          title: Resource pool
          type: string
        description:
          title: Description
          type: string

  steps:
    - id: action
      name: Create VM
      action: proxmox:create-vm
      input:
        connection: ${{ parameters.connection }}
        node: ${{ parameters.node }}
        name: ${{ parameters.name }}
        vmid: ${{ parameters.vmid }}
        cores: ${{ parameters.cores }}
        sockets: ${{ parameters.sockets }}
        memory: ${{ parameters.memory }}
        ostype: ${{ parameters.ostype }}
        net0: ${{ parameters.net0 }}
        disk: ${{ parameters.disk }}
        tags: ${{ parameters.tags }}
        pool: ${{ parameters.pool }}
        description: ${{ parameters.description }}

  output:
    text:
      - title: Proxmox instance
        content: ${{ steps['action'].output.connectionTitle }}
      - title: Created VM
        content: "${{ steps['action'].output.name }} (VMID ${{ steps['action'].output.vmid }}) on node ${{ steps['action'].output.node }}"
      - title: Proxmox task
        content: ${{ steps['action'].output.taskId }}
