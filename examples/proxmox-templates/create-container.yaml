apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: proxmox-create-container
  title: Proxmox — Create LXC Container
  description: |
    Creates an LXC container on a Proxmox node from an OS template.
    Invokes the `proxmox:create-container` action.
  tags:
    - proxmox
spec:
  owner: user:guest
  type: proxmox-action

  parameters:
    - title: Container
      required:
        - node
        - hostname
        - ostemplate
      properties:
        connection:
          title: Connection
          type: string
          description: Title or host of the Proxmox connection. Leave empty when only one is configured.
        node:
          title: Node
          type: string
          default: pve
        hostname:
          title: Hostname
          type: string
        ostemplate:
          title: OS template
          type: string
          description: For example local:vztmpl/debian-12-standard_12.7-1_amd64.tar.zst
        vmid:
          title: VMID
          type: number
          description: Leave empty to allocate the next free VMID
    - title: Resources
      properties:
        cores:
          title: Cores
          type: number
        memory:
          title: Memory (MiB)
          type: number
        swap:
          title: Swap (MiB)
          type: number
        storage:
          title: Root filesystem storage
          type: string
          default: local
        rootfsSize:
          title: Root filesystem size (GiB)
          type: number
        net0:
          title: Network device
          type: string
          description: For example name=eth0,bridge=vmbr0,ip=dhcp
        unprivileged:
          title: Unprivileged container
          type: boolean
          default: true
    - title: Placement
      properties:
        tags:
          title: Tags
          type: string
          description: Semicolon separated, for example cache;dev
        pool:
          title: Resource pool
          type: string
        description:
          title: Description
          type: string

  steps:
    - id: action
      name: Create container
      action: proxmox:create-container
      input:
        connection: ${{ parameters.connection }}
        node: ${{ parameters.node }}
        hostname: ${{ parameters.hostname }}
        ostemplate: ${{ parameters.ostemplate }}
        vmid: ${{ parameters.vmid }}
        cores: ${{ parameters.cores }}
        memory: ${{ parameters.memory }}
        swap: ${{ parameters.swap }}
        storage: ${{ parameters.storage }}
        rootfsSize: ${{ parameters.rootfsSize }}
        net0: ${{ parameters.net0 }}
        tags: ${{ parameters.tags }}
        pool: ${{ parameters.pool }}
        unprivileged: ${{ parameters.unprivileged }}
        description: ${{ parameters.description }}

  output:
    text:
      - title: Proxmox instance
        content: ${{ steps['action'].output.connectionTitle }}
      - title: Created container
        content: "${{ steps['action'].output.hostname }} (VMID ${{ steps['action'].output.vmid }}) on node ${{ steps['action'].output.node }}"
      - title: Proxmox task
        content: ${{ steps['action'].output.taskId }}
