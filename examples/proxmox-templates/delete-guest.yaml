apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: proxmox-delete-guest
  title: Proxmox — Delete Guest
  description: |
    Removes a Proxmox VM or LXC container. This is destructive.
    Invokes the `proxmox:delete-guest` action.
  tags:
    - proxmox
spec:
  owner: user:guest
  type: proxmox-action

  parameters:
    - title: Guest
      required:
        - node
        - vmid
        - guestType
      properties:
        connection:
          title: Connection
          type: string
          description: Title or host of the Proxmox connection. Leave empty when only one is configured.
        node:
          title: Node
          type: string
          default: pve
        vmid:
          title: VMID
          type: number
        guestType:
          title: Guest type
          type: string
          enum:
            - qemu
            - lxc
          default: qemu
        stopIfRunning:
          title: Stop the guest first when it is running
          type: boolean
          default: false
        purge:
          title: Also remove it from backup jobs and HA configuration
          type: boolean
          default: false

  steps:
    - id: action
      name: Delete guest
      action: proxmox:delete-guest
      input:
        connection: ${{ parameters.connection }}
        node: ${{ parameters.node }}
        vmid: ${{ parameters.vmid }}
        guestType: ${{ parameters.guestType }}
        stopIfRunning: ${{ parameters.stopIfRunning }}
        purge: ${{ parameters.purge }}

  output:
    text:
      - title: Proxmox instance
        content: ${{ steps['action'].output.connectionTitle }}
      - title: Deleted guest
        content: "VMID ${{ steps['action'].output.vmid }} on node ${{ steps['action'].output.node }}"
      - title: Proxmox task
        content: ${{ steps['action'].output.taskId }}
